{
  "type": "Microsoft.App/containerApps",
  "name": "sagejirabot",
  "location": "<LOCATION>",
  "identity": {
    "type": "UserAssigned",
    "userAssignedIdentities": {
      "/subscriptions/<SUBSCRIPTION_ID>/resourceGroups/<RESOURCE_GROUP>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<UAMI_NAME>": {}
    }
  },
  "properties": {
    "managedEnvironmentId": "/subscriptions/<SUBSCRIPTION_ID>/resourceGroups/<RESOURCE_GROUP>/providers/Microsoft.App/managedEnvironments/<ACA_ENVIRONMENT_NAME>",
    "workloadProfileName": "Consumption",
    "configuration": {
      "activeRevisionsMode": "Single",
      "ingress": {
        "external": true,
        "targetPort": 3006,
        "transport": "http",
        "allowInsecure": false
      },
      "registries": [
        {
          "server": "<ACR_LOGIN_SERVER>",
          "identity": "/subscriptions/<SUBSCRIPTION_ID>/resourceGroups/<RESOURCE_GROUP>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<UAMI_NAME>"
        }
      ],
      "secrets": [
        {
          "name": "jira-api-token",
          "value": "<JIRA_API_TOKEN - never commit; set with: az containerapp secret set>"
        }
      ]
    },
    "template": {
      "containers": [
        {
          "name": "sagejirabot",
          "image": "<ACR_LOGIN_SERVER>/sagejirabot:<GIT_SHORT_SHA>",
          "resources": {
            "cpu": 0.5,
            "memory": "1.0Gi"
          },
          "env": [
            {
              "name": "LLM_AUTH",
              "value": "identity"
            },
            {
              "name": "SOLUTION_NAME",
              "value": "sagejirabot"
            },
            {
              "name": "TELEMETRY_BLOB_ACCOUNT_URL",
              "value": "<STORAGE_BLOB_ENDPOINT from ~/dcri/azure-environment.md>"
            },
            {
              "name": "AZURE_OPENAI_ENDPOINT",
              "value": "<AZURE_OPENAI_ENDPOINT>"
            },
            {
              "name": "AZURE_OPENAI_API_VERSION",
              "value": "2025-03-01-preview"
            },
            {
              "name": "AZURE_CLIENT_ID",
              "value": "<UAMI_CLIENT_ID>"
            },
            {
              "name": "AGENT1_MODEL",
              "value": "gpt-5.4-mini"
            },
            {
              "name": "AGENT2_MODEL",
              "value": "gpt-5.4-mini"
            },
            {
              "name": "AGENT3_MODEL",
              "value": "gpt-5.4-mini"
            },
            {
              "name": "ENRICH_MODEL",
              "value": "gpt-5.4-mini"
            },
            {
              "name": "UPDATES_RETRIEVAL",
              "value": "1"
            },
            {
              "name": "UPDATES_VERIFIER",
              "value": "1"
            },
            {
              "name": "UPDATES_MATCH_MODEL",
              "value": "gpt-5.5"
            },
            {
              "name": "UPDATES_VERIFY_MODEL",
              "value": "gpt-5.5"
            },
            {
              "name": "UPDATES_STRICT_STATUS",
              "value": "1"
            },
            {
              "name": "UPDATES_DROP_WEAK",
              "value": "1"
            },
            {
              "name": "SESSION_COOKIE_SECURE",
              "value": "true"
            },
            {
              "name": "ATLASSIAN_OAUTH_REDIRECT_URI",
              "value": "https://sagejirabot.<ACA_ENV_DEFAULT_DOMAIN>/api/v1/auth/jira/callback"
            },
            {
              "name": "JIRA_BASE_URL",
              "value": "<JIRA_BASE_URL e.g. https://your-site.atlassian.net>"
            },
            {
              "name": "JIRA_EMAIL",
              "value": "<EMAIL_OF_JIRA_TOKEN_OWNER>"
            },
            {
              "name": "JIRA_API_TOKEN",
              "secretRef": "jira-api-token"
            },
            {
              "name": "JIRA_TOKEN_EXPIRES_ON",
              "value": "<YYYY-MM-DD optional: date the Jira API token expires>"
            }
          ],
          "probes": [
            {
              "type": "Liveness",
              "httpGet": {
                "path": "/health",
                "port": 3006
              },
              "initialDelaySeconds": 15,
              "periodSeconds": 10
            },
            {
              "type": "Readiness",
              "httpGet": {
                "path": "/health",
                "port": 3006
              },
              "initialDelaySeconds": 15,
              "periodSeconds": 10
            }
          ]
        }
      ],
      "scale": {
        "minReplicas": 1,
        "maxReplicas": 1
      }
    }
  }
}
